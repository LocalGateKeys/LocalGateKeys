[versions]
kotlin = "2.4.21"
bouncycastle = "1.87"
junit = "5.11.4"
agp = "9.5.2"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
argon2kt = "1.6.0"
junit4 = "4.13.2"
androidxTestRunner = "1.6.2"
lifecycle = "2.11.0"
biometric = "1.2.0-alpha05"
uiautomator = "2.4.1"
camerax = "1.6.1"
zxing = "3.5.4"
playBilling = "9.1.0"
credentials = "1.5.0"
autofill = "1.3.0"
appcompat = "1.8.0"
# YubiKey HMAC-SHA1 challenge-response over NFC and USB (Apache-2.0).
yubikit = "3.3.0"
# The home-screen codes widget (sub-plan 06): Glance and the WorkManager job that hides an expired code.
glance = "1.2.0"
work = "2.12.0"
# The Wear OS codes tile (sub-plan 06): the Wearable Data Layer (phone and watch) and Wear Tiles (watch only).
# Parked with the Wear OS tile (2026-11-08): unused by :app, kept for the parked :wear module.
playWearable = "20.0.1"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
concurrentFutures = "1.3.0"
# Phone Wi-Fi host on API 29-32: the mDNS announcement bound to the Wi-Fi address (Apache-2.0; only dependency slf4j-api, already brought by YubiKit).
jmdns = "3.6.5"

[libraries]
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "playBilling" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
yubikit-core = { module = "com.yubico.yubikit:core", version.ref = "yubikit" }
yubikit-android = { module = "com.yubico.yubikit:android", version.ref = "yubikit" }
yubikit-yubiotp = { module = "com.yubico.yubikit:yubiotp", version.ref = "yubikit" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
# Parked with the Wear OS tile (2026-11-08): the three Wear entries below are unused by :app.
play-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playWearable" }
androidx-wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
androidx-wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "wearProtolayout" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
