<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalVault Login Demo</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f3f4f6; }
      main { width: min(420px, calc(100vw - 40px)); box-sizing: border-box; background: white; padding: 28px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.14); }
      h1 { margin-top: 0; }
      label { display: block; margin-top: 14px; font-weight: 650; }
      input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border: 1px solid #999; border-radius: 7px; font: inherit; }
      button { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 7px; background: #1f5fbf; color: white; font: inherit; font-weight: 700; }
      #result { min-height: 24px; margin-top: 14px; }
      code { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>LocalVault test login</h1>
      <p>This page never sends credentials anywhere. Serve it from <code>localhost</code> to test save and fill.</p>
      <form id="login-form">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username" value="tester@example.com" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <button type="submit">Sign in</button>
      </form>
      <div id="result" role="status"></div>
    </main>
    <script>
      document.getElementById("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("result").textContent = "Demo submission intercepted locally.";
      });
    </script>
  </body>
</html>
