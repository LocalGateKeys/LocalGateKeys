[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localgatekeys"
version = "0.4.10"
description = "Local-first encrypted credential manager for browsers and desktop applications"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "LicenseRef-PolyForm-Strict-1.0.0"}
authors = [{name = "LocalGateKeys"}]
dependencies = [
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  # UTS-46 host canonicalisation matching browsers (origin.py).
  "idna>=3.7",
  "psutil>=5.9.0",
  # QR code for LAN sync pairing (pure Python, BSD).
  "segno>=1.6",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
  "pystray>=0.19.5; platform_system == 'Windows'",
  "pywebview>=6.2,<7; platform_system == 'Windows'",
  "Pillow>=13.0.0; platform_system == 'Windows'",
  "opencv-contrib-python>=4.13.0.92,<5; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Development loop: tests, lint, types, coverage, dependency locking, SBOM.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Property-based tests (tests/props); LGK_PROP_EXAMPLES raises the per-property budget.
  "hypothesis>=6.170",
  "ruff>=0.6",
  "mypy>=1.10",
  "pip-tools>=7.4",
  "cyclonedx-bom>=4.0",
]
# Frozen-executable build. PyInstaller is pinned to the validated version so a
# rebuild from the same commit produces the same bootloader and hook set.
build = ["pyinstaller==6.22.3"]

[project.scripts]
localgatekeys-agent = "localvault.agent:main"
localgatekeys-native-host = "localvault.native_host:main"
localgatekeys-inspect = "localvault.uia:inspect_main"
# Compatibility aliases during the prototype-to-product rename.
localvault-agent = "localvault.agent:main"
localvault-native-host = "localvault.native_host:main"
localvault-inspect = "localvault.uia:inspect_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localvault = ["assets/*", "assets/**/*", "models/*"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py owns the temporary directory (an absolute path under
# <repo>/.pytest-tmp/), so --basetemp is intentionally not set here.
# The cache provider is disabled so a run never writes .pytest_cache into the
# checkout or into an ACL-restricted system temp directory.
addopts = "-q -p no:cacheprovider"
markers = [
  "fuzz: deterministic seeded mutation fuzzing of file/frame parsers (included in the default run; select with -m fuzz)",
  "min_screen(width, height): skip unless the primary screen is at least this many pixels (window-geometry tests)",
  "free_features: run with the real free plan, where sync, two-factor codes and attachments are Pro-only",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".pytest-tmp",
  "build-personal/agent",
  "build-personal/native",
  "dist-personal",
  "dist-installer",
  "release-inputs",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "B",   # bugbear
  "S",   # bandit (security)
  "UP",  # pyupgrade
  "I",   # isort
  "W",   # pycodestyle warnings
]
# The legacy UI modules use a dense one-statement-per-line style (about 3,500
# findings). Reflowing them is a separate, reviewable change; until then these
# three style rules are ignored so the remaining findings are a real signal.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["localvault"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed test passwords, and spawn the native host / Node on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
# Seeded `random` is the point of the fuzz harness; it is not used for secrets.
"tests/fuzz/**" = ["S311"]
# Build/maintenance scripts invoke pip, PyInstaller, PowerShell and Node deliberately.
"scripts/**" = ["S603", "S607"]
# These modules intentionally run fixed, non-user-controlled executables
# (PowerShell bridge repair, signtool/certutil lookups, Tesseract OCR).
"src/localvault/bridge_diagnostics.py" = ["S603", "S607"]
"src/localvault/browser_bridge.py" = ["S603", "S607"]
"src/localvault/feature_ui.py" = ["S603", "S607"]
"src/localvault/ocr_search.py" = ["S603", "S607"]
"src/localvault/signature.py" = ["S603", "S607"]
# PyInstaller spec files are executed by PyInstaller with injected globals.
"*.spec" = ["F821"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/localvault"]
exclude = ["^tests/", "^scripts/", "^build-personal/", "^localgatekeys_app/"]
# Lenient baseline for the UI-heavy modules; the security boundary modules
# below are checked strictly.
ignore_missing_imports = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = false
show_error_codes = true
follow_imports = "normal"

# Security boundary modules: equivalent of `mypy --strict`, spelled out because
# `strict` itself is not a per-module option.
[[tool.mypy.overrides]]
module = [
  "localvault.vault",
  "localvault.protocol",
  "localvault.native_host",
  "localvault.origin",
  "localvault.pipe_transport",
  "localvault.sync",
  "localvault.sync.*",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

# Windows-only and binary extension packages without usable type stubs.
[[tool.mypy.overrides]]
module = [
  "win32api", "win32con", "win32security", "win32file", "win32pipe", "win32gui",
  "win32process", "win32clipboard", "win32crypt", "win32ts", "pywintypes",
  "pythoncom",
  "pystray",
  "cv2", "cv2.*",
  "pywinauto", "pywinauto.*",
  "PIL", "PIL.*",
  "psutil",
  "argon2", "argon2.*",
  "numpy", "numpy.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# coverage (pytest-cov)
# --------------------------------------------------------------------------
[tool.coverage.run]
source = ["localvault"]
branch = true
omit = [
  "src/localvault/models/*",
  "src/localvault/assets/*",
]

[tool.coverage.paths]
source = ["src/localvault", "*/site-packages/localvault"]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
