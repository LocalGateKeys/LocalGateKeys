name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }} (lint, types, tests)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install hash-pinned development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      # Ruff runs with the real rule set (E F B S UP I W) and reports on every
      # PR, but it is advisory until the pre-existing backlog (3402 findings in
      # src+tests on 2026-10-05, mostly E501/E701/E702 from the single-line
      # legacy style) is paid down. Flip continue-on-error to false once
      # `python -m ruff check src tests scripts` is clean.
      - name: Ruff (lint, advisory)
        continue-on-error: true
        run: python -m ruff check src tests scripts --output-format=github

      # mypy is advisory until the strict modules (vault, protocol, native_host,
      # origin, pipe_transport, sync) are clean. Flip continue-on-error to false
      # once `python -m mypy` passes locally; the job then becomes a gate.
      - name: mypy (advisory)
        continue-on-error: true
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q

  node:
    name: Browser extension tests (node --test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # package.json is a dev-only harness (jsdom for the content-script tests);
      # nothing from node_modules is shipped. `npm ci` fails on a lock mismatch.
      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: Syntax-check extension scripts
        shell: pwsh
        run: |
          Get-ChildItem browser-extension -Filter *.js -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($_.Name)" }
          }

  # iOS: the LGKCore Swift package, then the XcodeGen app project on a
  # Simulator. Independent of the Windows jobs; nothing depends on it.
  swift:
    name: Swift (LGKCore package, iOS app tests)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app uses iOS 26 APIs (Liquid Glass behind #available), so it needs
      # the Xcode 26 SDK. Pick the newest non-beta Xcode 26 on the image.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      # Test vectors come from the desktop's tests/vectors/ in this checkout.
      - name: swift test (LGKCore)
        run: swift test --package-path ios/LGKCore

      # XcodeGen from its GitHub release, pinned by version and by the sha256
      # GitHub publishes for the asset (not Homebrew, which floats). Bumping it:
      # change both lines to the new release's xcodegen.zip version and digest.
      - name: Generate the Xcode project (XcodeGen)
        if: hashFiles('ios/project.yml') != ''
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL --retry 3 -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/xcodegen"
          unzip -q "$zip" -d "$RUNNER_TEMP"
          xcodegen="$RUNNER_TEMP/xcodegen/bin/xcodegen"
          "$xcodegen" --version
          cd ios
          "$xcodegen" generate

      # Device names change with every Xcode (iPhone 16, 17, ...), so pick the
      # first available iPhone on the newest installed iOS runtime by UDID.
      - name: Pick an iOS Simulator
        id: sim
        if: hashFiles('ios/project.yml') != ''
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else None
          for runtime in sorted((r for r in devices if version(r)), key=version, reverse=True):
              phones = [d for d in devices[runtime] if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); print(runtime, phones[0]["name"], file=sys.stderr); break
          ')"
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator"; xcrun simctl list devices available; exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Scheme LocalGateKeys runs AppSharedTests, AutoFillTests and
      # LocalGateKeysTests (StoreKit tests load App/StoreKit/LocalGateKeys.storekit
      # through SKTestSession, bundled as a test resource). Unsigned on CI.
      - name: xcodebuild test (LocalGateKeys scheme)
        if: hashFiles('ios/project.yml') != ''
        run: |
          set -o pipefail
          xcodebuild test             -project ios/LocalGateKeys.xcodeproj             -scheme LocalGateKeys             -destination "id=${{ steps.sim.outputs.udid }}"             CODE_SIGNING_ALLOWED=NO

  build-smoke:
    name: Build smoke (PyInstaller, no installer)
    runs-on: windows-latest
    needs: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Create project venv from the hash-pinned lock
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock.txt
          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .

      # Downloads the two hash-pinned OpenCV Zoo models, freezes both executables,
      # runs their --check-build self-test, produces the SBOM and manifest, and
      # stops before Inno Setup (not installed on the runner). Unsigned by design.
      - name: Build frozen executables
        shell: pwsh
        run: .\scripts\build_personal_installer.ps1 -SkipInstaller -OutputRoot ci-build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-smoke-manifest
          path: |
            ci-build/dist-installer/*.manifest.json
            ci-build/dist-installer/*.sbom.cdx.json
            ci-build/dist-installer/*.sha256
          if-no-files-found: error
