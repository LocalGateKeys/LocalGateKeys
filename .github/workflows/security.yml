name: Security

# Free security scanners on every push, on pull requests and once a week.
# Secrets: Gitleaks. Code: Semgrep, CodeQL. Dependencies: OSV-Scanner, pip-audit,
# npm audit, Trivy. CodeQL needs a public repository (or paid code scanning), so
# it runs only on the public LocalGateKeys/LocalGateKeys repository.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_VERSION: "2.7.0"
  OSV_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
  SEMGREP_VERSION: "1.185.0"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan the full git history
        # .gitleaks.toml allowlists test vectors, fixtures and public-by-design values.
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: No browser profiles in the tree
        # A committed profile carries cookies and session tokens. .gitignore blocks the usual
        # files; this catches a forced add.
        run: |
          hits=$(git ls-files | grep -E '(^|/)(Secure Preferences|Local State|Login Data|Cookies|Web Data|cookies\.sqlite|logins\.json|key4\.db|places\.sqlite)$|/Default/(Preferences|Cache/|Network/|Local Storage/|IndexedDB/)' || true)
          if [ -n "$hits" ]; then echo "::error::Browser profile files are tracked:"; echo "$hits"; exit 1; fi

  semgrep:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Scan (fails on ERROR-severity findings)
        run: >-
          semgrep scan --metrics off --error --severity ERROR
          --config p/default --config p/secrets --config p/cwe-top-25
          --config p/python --config p/javascript --config p/kotlin --config p/swift --config p/csharp

  dependencies:
    name: Dependencies (OSV-Scanner, pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install OSV-Scanner (checksum-verified)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: OSV-Scanner (every lockfile)
        run: |
          args=()
          while IFS= read -r f; do args+=(-L "$f"); done < <(git ls-files | grep -E '(package-lock\.json|requirements.*lock\.txt|Package\.resolved|packages\.lock\.json|gradle\.lockfile)$')
          ./osv-scanner scan --config osv-scanner.toml "${args[@]}"
      - name: pip-audit (hash-pinned Python locks)
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==${PIP_AUDIT_VERSION}"
          for f in requirements.lock.txt requirements-build.lock.txt; do
            pip-audit --strict --disable-pip --no-deps -r "$f"
          done
      - name: npm audit (high and critical, shipped dependencies)
        run: |
          git ls-files | grep -E '(^|/)package-lock\.json$' | while read -r f; do
            d=$(dirname "$f"); echo "== $d"
            (cd "$d" && npm audit --omit=dev --audit-level=high)
          done

  trivy:
    name: Vulnerabilities and misconfiguration (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Trivy (checksum-verified)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy && rm trivy.tgz
      - name: Scan (fails on HIGH or CRITICAL)
        run: >-
          ./trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs tests --skip-dirs android/lgk-core/src/test --skip-files ./trivy .

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.repository == 'LocalGateKeys/LocalGateKeys'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
