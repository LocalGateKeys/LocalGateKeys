version: 2
updates:
  # Python: pyproject.toml ranges plus the hash-pinned lock files.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]

  # npm: the extension test harness at the root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, npm]

  # npm: the desktop web UI and the Cloudflare workers.
  - package-ecosystem: npm
    directories:
      - "/webui"
      - "/cloudflare/license-issuer"
      - "/cloudflare/update-feed"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, npm]

  # Android app (Gradle Kotlin DSL).
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, android]

  # iPhone core Swift package.
  - package-ecosystem: swift
    directory: "/ios/LGKCore"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, ios]

  # Actions are pinned to commit SHAs (version in a comment); Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
